<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>primothy's stylesheets</title>
  <style>
    :root {
      --base: #1e1e2e;
      --mantle: #181825;
      --crust: #11111b;
      --surface0: #313244;
      --surface1: #45475a;
      --text: #cdd6f4;
      --subtext: #a6adc8;
      --mauve: #cba6f7;
      --blue: #89b4fa;
      --green: #a6e3a1;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: "Lato", Helvetica, Arial, sans-serif;
      background: var(--mantle);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 2rem 1rem;
    }
    .banner {
      max-width: 100%;
      border-radius: 8px;
      margin-bottom: 2rem;
    }
    h1 {
      color: var(--mauve);
      margin-bottom: 0.25rem;
      font-weight: 900;
    }
    .subtitle {
      color: var(--subtext);
      margin-bottom: 2rem;
      text-align: center;
    }
    .styles {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .style-card {
      background: var(--base);
      border: 1px solid var(--surface0);
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
      text-decoration: none;
      color: var(--text);
      transition: border-color 0.15s, transform 0.15s;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .style-card:hover {
      border-color: var(--mauve);
      transform: translateY(-2px);
    }
    .style-card .name {
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--blue);
    }
    .style-card .desc {
      color: var(--subtext);
      font-size: 0.9rem;
    }
    .style-card .arrow {
      color: var(--mauve);
      font-size: 1.25rem;
    }
    footer {
      margin-top: 3rem;
      color: var(--surface1);
      font-size: 0.85rem;
    }
    footer a { color: var(--subtext); }
  </style>
</head>
<body>
  <img class="banner" src="BTN/images/banner.gif" alt="banner">
  <h1>Prim's stylesheets</h1>
  <p class="subtitle">Themes for BroadcasTheNet</p>
  <div class="styles">
    <a class="style-card" href="BTN/caviar_catppuccin_mocha.css">
      <span>
        <div class="name">Caviar &mdash; Catppuccin Mocha</div>
      </span>
      <span class="arrow">&rarr;</span>
    </a>

    <a class="style-card" href="BTN/caviar_oled.css">
      <span>
        <div class="name">Caviar &mdash; OLED</div>
      </span>
      <span class="arrow">&rarr;</span>
    </a>

    <a class="style-card" href="BTN/SMPTEv3_catppuccin_mocha.css">
      <span>
        <div class="name">SMPTEv3 &mdash; Catppuccin Mocha</div>
      </span>
      <span class="arrow">&rarr;</span>
    </a>

    <a class="style-card" href="BTN/darknround_catppuccin_mocha.css">
      <span>
        <div class="name">darknround &mdash; Catppuccin Mocha (WIP)</div>
      </span>
      <span class="arrow">&rarr;</span>
    </a>
  </div>

  <footer>
    <a href="https://github.com/primothy/primothy.github.io">View on GitHub</a>
  </footer>
</body>
</html>
